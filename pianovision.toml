# pianovision configuration (python -m pianovision ...)
# Relative paths are relative to this file.

[library]
scores = "/home/john/Documents/MuseScore4/Scores"   # *.mscz sources; rename a score to .zip to exclude it
output = "PianoVision"                              # JSON library + .manifest.json + .attic/

[convert]
orchestra = true      # the old convert_all.sh -o
simplified = true     # the old convert_all.sh -s
jobs = 0              # parallel renders, 0 = one per CPU
options = "scores.json"   # per-score options: titles, piano staves and hands, simplified parts from arrangements

[device]
dir = "/sdcard/Android/data/com.ZarApps.PianoVision/files"
serial = ""           # empty = the attached Quest

[hands]
# hand edits recorded with Note Waterfall's HAND REC (python -m pianovision hands pull|review|apply)
device_dir = "/sdcard/Android/data/com.atonalfreerider.notewaterfall/files/HandEdits"
waterfall_deploy = "python3 /home/john/Desktop/Note-Waterfall/Tools/deploy_songs.py"   # run with --only <song>... after apply

[accompaniment]
# Note Waterfall's companion audio (python -m pianovision accompaniment): the scores minus the piano part,
# rendered by MuseScore with Muse Sounds; per-score options (relabelled instruments, ...) in accompaniment.json
out_dir = "~/Music/Note Waterfall Accompaniments"   # <song>.mp3 + accompaniment-report.md/.json
work_dir = "~/.cache/nw-accomp"                     # render copies, WAVs, MuseScore's config/cache/logs
mscore = "~/.local/bin/mscore"                      # MuseScore Studio 4.7 (AppImage)
musesampler = "~/.local/share/MuseSampler"          # the Muse Sounds engine; its .config names the libraries
options = "accompaniment.json"
bitrate = 256           # kbit/s, constant bit rate
lufs = -16.0            # integrated loudness target (linear gain, no compression)
true_peak = -1.0        # dBTP ceiling: the gain is capped so the peaks stay below
timing_python = "~/miniconda3/envs/midi-retime/bin/python"   # numpy + soundfile + librosa; "" skips the timing check
timing_script = "tools/accompaniment_timing.py"

[recordings]
# Note Waterfall's companion audio from recordings you own (python -m pianovision recordings match|align|retime|status):
# a recording linked to its song (a TypeSafe judgment; TYPESAFE_API_KEY), aligned and retimed onto the song's timeline
music_dir = "~/Music"                               # read only
exclude = ["Note Waterfall Accompaniments", "MuseScore MIDI"]
links = "recordings.json"                           # the links (and your decisions), checked in
out_dir = "~/.cache/nw-recordings/out"              # <song>.mp3, audio_map.proposed.json, accuracy/, recordings-report.md
work_dir = "~/.cache/nw-recordings/work"            # inventory, references, alignments, WAVs
python = "~/miniconda3/envs/midi-retime/bin/python" # numpy + scipy + soundfile + librosa (alignment, retime, checks)
script = "tools/recording_align.py"
model = "jev-1.13.0"                                # pinned: the thresholds were set with it
link_confidence = 0.6                               # Choice confidence to link without your confirmation
same_min = 0.8                                      # Noul "same composition" for a candidate to count
retune_cents = 15.0                                 # retune a recording to A440 when it is off by this much (0: never)
# routes: 'generated' (classical / instrumental: the score's orchestra, `accompaniment`) or 'vocals' (sung songs)
sung_min = 0.8                                      # TypeSafe "sung" from this up: sung (scores without a vocal line)
unsung_max = 0.3                                    # ... up to this: instrumental; in between: your decision
classical_min = 0.5                                 # P(classical) from this up: generated, sung or not
# the vocals of a sung song's recording: Demucs in another Python (not installed by this tool)
stems_dir = "~/.cache/nw-recordings/stems"          # vocals stems, cached by the input's content
separator_python = "~/.cache/nw-stems/venv/bin/python"   # demucs 4.1 over beat_this' torch (CUDA); "" = first env with it
separator_model = "htdemucs_ft"
min_vocal_activity = 0.1                            # a vocals stem singing in less of the matched recording is not used
min_melody_agreement = 0.3                          # its pitch must agree with the score's vocal line this often
audio_map = "~/Desktop/Note-Waterfall/Tools/audio_map.json"   # read only: what Note Waterfall has now
